[project]
name = "defile-dataset"
version = "0.1.0"
description = "Raptor and bird migration counts at Défilé de l'Écluse (1966 on): raw files -> documented survey and observation tables"
requires-python = ">=3.11,<3.12"

# Exact pins, as in defile-migration-forecast (the main consumer of this dataset), so the two
# repos read the same files with the same library versions. Bump deliberately.
dependencies = [
    "pandas==2.3.3",
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "matplotlib==3.10.3",
    "suncalc==0.1.3",
    "pytest==9.0.3",
    "frictionless==5.18.1",
    "plotly==6.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defile_dataset"]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
